name: Docker Build and Push

# Builds the image natively on amd64 and arm64 runners, smoke tests it,
# uploads it as a workflow artifact and pushes it to GitHub Container Registry
# on main pushes and version tags.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  PUSH: ${{ github.event_name != 'pull_request' }}

jobs:
  build:
    name: build (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            arch: amd64
          - os: ubuntu-24.04-arm
            arch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: matrixbridgemanager:test
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.arch }},mode=max

      - name: Smoke test image
        run: |
          printf '{}\n' > /tmp/hookshot-config.yml
          output=$(timeout 10 docker run --rm \
            -v /tmp/hookshot-config.yml:/data/config.yml:ro \
            matrixbridgemanager:test 2>&1 || true)
          echo "$output"
          echo "$output" | grep -q "Loading config from"

      - name: Export image
        run: docker save matrixbridgemanager:test | gzip > matrixbridgemanager-${{ matrix.arch }}.tar.gz

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image-${{ matrix.arch }}
          path: matrixbridgemanager-${{ matrix.arch }}.tar.gz
          retention-days: 14

      - name: Push arch image
        if: env.PUSH == 'true'
        run: |
          docker tag matrixbridgemanager:test "$IMAGE:${GITHUB_SHA::7}-${{ matrix.arch }}"
          docker push "$IMAGE:${GITHUB_SHA::7}-${{ matrix.arch }}"

  manifest:
    name: manifest
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request'

    steps:
      - name: Set image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,prefix=,format=short

      - name: Create and push multi-arch manifest
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          src="$IMAGE:${GITHUB_SHA::7}"
          args=()
          for tag in $TAGS; do args+=(-t "$tag"); done
          docker buildx imagetools create "${args[@]}" "$src-amd64" "$src-arm64"
